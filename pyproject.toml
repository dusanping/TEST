[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "host-load-analyzer"
version = "0.1.0"
description = "PromQL-based host CPU/Disk load analysis with anomaly checks and capacity forecast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
host-load-analyzer = "host_load_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
